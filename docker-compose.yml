version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chargeguard-db
    environment:
      POSTGRES_USER: ${DB_USER:-chargeguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: ${DB_NAME:-chargeguard_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chargeguard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chargeguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: chargeguard-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-chargeguard}:${DB_PASSWORD:-change_me}@db:5432/${DB_NAME:-chargeguard_db}?schema=public
      - API_KEY=${API_KEY}
      - IDENTITY_GRAPH_SECRET=${IDENTITY_GRAPH_SECRET}
      - IPQS_API_KEY=${IPQS_API_KEY}
      - MOCK_IP_INTEL=false
      - MOCK_BIN_INTEL=false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chargeguard-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: chargeguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - chargeguard-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: chargeguard-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - chargeguard-network
    restart: unless-stopped

networks:
  chargeguard-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: