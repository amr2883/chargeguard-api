services:
  db:
    image: postgres:16-alpine
    container_name: chargeguard-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - chargeguard-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: chargeguard-postgres-exporter-prod
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
    networks:
      - chargeguard-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: chargeguard-blackbox-prod
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks:
      - chargeguard-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chargeguard-app-prod
    # تم إزالة تعريض المنفذ 3000 للعامة – الآن فقط Nginx يتصل به داخلياً
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      - API_KEY=${API_KEY}
      - IDENTITY_GRAPH_SECRET=${IDENTITY_GRAPH_SECRET}
      - IPQS_API_KEY=${IPQS_API_KEY}
      - MOCK_IP_INTEL=false
      - MOCK_BIN_INTEL=false
      - ENABLE_IP_INTEL=true
      - ENABLE_EMAIL_INTEL=true
      - ENABLE_BIN_INTEL=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chargeguard-network-prod
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    container_name: chargeguard-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - chargeguard-network-prod
    restart: always
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: chargeguard-cloudflared-prod
    command: tunnel --url http://chargeguard-app-prod:3000
    networks:
      - chargeguard-network-prod
    restart: always
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  prometheus:
    image: prom/prometheus:latest
    container_name: chargeguard-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - chargeguard-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: chargeguard-grafana-prod
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - chargeguard-network-prod
    restart: always
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  chargeguard-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
  prometheus_data_prod:
  grafana_data_prod: