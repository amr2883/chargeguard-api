name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chargeguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chargeguard_test
      MOCK_IP_INTEL: 'false'
      MOCK_BIN_INTEL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate throwaway test secrets
        run: |
          for n in CARD_HASH_SECRET SECRET_SALT IDENTITY_GRAPH_SECRET PATTERN_SHARING_SECRET DEVICE_TOKEN_SECRET CHALLENGE_TICKET_SECRET UPDATE_DOWNLOAD_SECRET API_KEY_HASH_SECRET ADMIN_SECRET INTERNAL_TOKEN; do
            echo "$n=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          done
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Apply pending CONTRACT step (CI database only)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/migrations-pending/contract_drop_order_unique.sql
      - run: npx jest --ci