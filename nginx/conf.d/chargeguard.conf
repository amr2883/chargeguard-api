server {
    listen 80;
    listen [::]:80;
    server_name chargeguard.local;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chargeguard.local;

    ssl_certificate /etc/nginx/ssl/chargeguard.crt;
    ssl_certificate_key /etc/nginx/ssl/chargeguard.key;

    location / {
        limit_req zone=chargelimit burst=20 nodelay;
        limit_conn connlimit 10;

        proxy_pass http://$backend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_redirect off;
        client_max_body_size 1M;
    }

    location /api/webhooks/woocommerce/ {
        proxy_pass http://$backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        proxy_pass http://chargeguard-app-prod:3000;
        proxy_set_header Host $host;
    }
}
